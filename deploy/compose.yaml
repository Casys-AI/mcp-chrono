services:
  chrono:
    image: ${CHRONO_IMAGE:-ghcr.io/casys-ai/mcp-chrono:0.1.0}
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in deploy/.env}
    ports:
      - "127.0.0.1:3025:3025"
    volumes:
      - chrono-data:/data
    restart: unless-stopped
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  chrono-data:

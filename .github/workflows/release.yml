name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  REGISTRY_IMAGE: ghcr.io/casys-ai/mcp-chrono
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Casys-AI/mcp-server
          ref: bb8bffd096829ff617b32d73791cb2887aa792d8
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.6 }
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          test "$GITHUB_REF_NAME" = "v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: deno fmt --check
      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - run: deno task check:ui:bundle
      - run: deno publish --dry-run
      - name: Verify CPU-only lock boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'package=(cuda|cudnn|libcu|mkl|intel-mkl|mpi|openmpi|mpich|libgl|libegl|libopengl|opengl|xorg-|font-|fonts-|qt|vtk|irrlicht)' locks/pychrono-linux-64.explicit.txt
      - run: docker build --platform linux/amd64 --tag mcp-chrono:release-verify .
      - run: ./scripts/docker-smoke.sh mcp-chrono:release-verify
      - name: Verify final image notice boundary
        run: docker run --rm --entrypoint python mcp-chrono:release-verify /app/scripts/verify_image_notices.py
      - name: Record release-verify container evidence
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format 'image_id={{.Id}}' mcp-chrono:release-verify
          docker image inspect --format 'docker_size_bytes={{.Size}}' mcp-chrono:release-verify
          docker image save mcp-chrono:release-verify | gzip -n | wc -c | awk '{print "docker_save_gzip_bytes=" $1}'
          docker history --no-trunc mcp-chrono:release-verify
      - name: Generate release-verify SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        env:
          SYFT_SELECT_CATALOGERS: "+conda-meta-cataloger"
        with:
          image: mcp-chrono:release-verify
          format: spdx-json
          output-file: mcp-chrono-release-verify.spdx.json
          artifact-name: mcp-chrono-release-verify-sbom
          upload-artifact: true
          upload-release-assets: false
      - name: Verify release-verify SBOM dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            ([.packages[] | select(.name == "chrono" and .versionInfo == "10.0.0")] | length == 1)
            and
            ([.packages[] | select(.name == "pychrono" and .versionInfo == "10.0.0")] | length == 1)
          ' mcp-chrono-release-verify.spdx.json >/dev/null
          ! jq -r '.packages[].name' mcp-chrono-release-verify.spdx.json \
            | grep -Ei '^(cuda|cudnn|libcu|mkl|intel-mkl|mpi|openmpi|mpich|libgl|libegl|libopengl|opengl|xorg-|font-|fonts-|qt|vtk|irrlicht)'
  publish-jsr:
    needs: verify
    if: vars.CHRONO_JSR_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.6 }
      - run: deno publish

  publish-ghcr:
    needs: verify
    if: vars.CHRONO_GHCR_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Refuse to overwrite immutable GHCR tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          api_url="https://api.github.com/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions?per_page=100"
          page=1
          while :; do
            response_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url&page=$page")"
            case "$response_status" in
              404)
                if [ "$page" -eq 1 ]; then
                  # The package does not exist yet, so both tags are available.
                  exit 0
                fi
                echo "GHCR package disappeared while checking immutable tags." >&2
                exit 1
                ;;
              200)
                ;;
              *)
                echo "Could not establish whether GHCR tags are available (HTTP $response_status)." >&2
                exit 1
                ;;
            esac
            if jq -e --arg version "$VERSION" --arg sha_tag "$SHA_TAG" '
              any(.[]; (.metadata.container.tags // []) | index($version) or index($sha_tag))
            ' "$response_file" >/dev/null; then
              echo "Refusing to overwrite existing GHCR tag: $VERSION or $SHA_TAG." >&2
              exit 1
            fi
            [ "$(jq 'length' "$response_file")" -eq 100 ] || break
            page=$((page + 1))
          done
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

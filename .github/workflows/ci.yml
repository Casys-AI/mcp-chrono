name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-24.04
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Casys-AI/mcp-server
          ref: 87b54e555f5f2ab125405640c4e15fea481788f8
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.6 }
      - run: deno fmt --check
      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - run: deno task check:ui:bundle
      - run: deno publish --dry-run
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify CPU-only lock boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'package=(cuda|cudnn|libcu|mkl|intel-mkl|mpi|openmpi|mpich|libgl|libegl|libopengl|opengl|xorg-|font-|fonts-|qt|vtk|irrlicht)' locks/pychrono-linux-64.explicit.txt
      - run: docker build --platform linux/amd64 --tag mcp-chrono:ci .
      - run: ./scripts/docker-smoke.sh mcp-chrono:ci
      - name: Verify final image notice boundary
        run: docker run --rm --entrypoint python mcp-chrono:ci /app/scripts/verify_image_notices.py
      - name: Record container candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format 'image_id={{.Id}}' mcp-chrono:ci
          docker image inspect --format 'docker_size_bytes={{.Size}}' mcp-chrono:ci
          docker image save mcp-chrono:ci | gzip -n | wc -c | awk '{print "docker_save_gzip_bytes=" $1}'
          docker history --no-trunc mcp-chrono:ci
      - name: Generate candidate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        env:
          SYFT_SELECT_CATALOGERS: "+conda-meta-cataloger"
        with:
          image: mcp-chrono:ci
          format: spdx-json
          output-file: mcp-chrono-ci.spdx.json
          artifact-name: mcp-chrono-ci-sbom
          upload-artifact: true
          upload-release-assets: false
      - name: Verify candidate SBOM dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            ([.packages[] | select(.name == "chrono" and .versionInfo == "10.0.0")] | length == 1)
            and
            ([.packages[] | select(.name == "pychrono" and .versionInfo == "10.0.0")] | length == 1)
          ' mcp-chrono-ci.spdx.json >/dev/null
          ! jq -r '.packages[].name' mcp-chrono-ci.spdx.json \
            | grep -Ei '^(cuda|cudnn|libcu|mkl|intel-mkl|mpi|openmpi|mpich|libgl|libegl|libopengl|opengl|xorg-|font-|fonts-|qt|vtk|irrlicht)'

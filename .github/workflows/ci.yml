name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.2 }
      - run: deno fmt --check
      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - run: deno publish --dry-run
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --platform linux/amd64 --tag mcp-chrono:ci .
      - run: ./scripts/docker-smoke.sh mcp-chrono:ci
